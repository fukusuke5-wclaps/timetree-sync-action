
name: Get TimeTree Alias Code

on:
  workflow_dispatch:

jobs:
  get-alias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ./vendor/timetree_exporter
      - name: List calendars
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          from timetree.service import TimeTreeService
          service = TimeTreeService()
          service.login(
              os.environ["TIMETREE_EMAIL"],
              os.environ["TIMETREE_PASSWORD"]
          )
          for cal in service.get_calendars():
              print(cal.get("name"), "code=", cal["alias_code"])
          PY
